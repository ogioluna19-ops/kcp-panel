<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KCP TV · Panel</title>
<style>
:root{--bg:#060b1a;--card:#0f1830;--card2:#152245;--line:#223360;--ice:#4fc3f7;--org:#ff7043;--tx:#eaf2ff;--mut:#9fb0d3;--ok:#43a047;--warn:#fb8c00;--bad:#e53935}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#16306a55,transparent),radial-gradient(900px 500px at 100% 110%,#ff704322,transparent),var(--bg);color:var(--tx);min-height:100vh}
[hidden]{display:none!important}
h1,h2,h3{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:#0a1330;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ice)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--card2);border:1px solid var(--line)}
button:hover{border-color:var(--ice)}
button.pri{background:linear-gradient(135deg,var(--ice),#2b8bd6);color:#04122b;font-weight:700;border:0}
button.dan{border-color:#7a2a2a;color:#ff9a9a}
button.sm{padding:5px 9px;font-size:12px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
.logo{font-weight:900;font-size:30px;letter-spacing:2px}.logo b{color:var(--ice)}.logo i{color:var(--org);font-style:normal}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#0a1330cc;border-bottom:1px solid var(--line);position:sticky;top:0;backdrop-filter:blur(8px);z-index:5;flex-wrap:wrap}
header .sp{flex:1}
.who{font-size:12px;color:var(--mut)}
nav{display:flex;gap:6px;padding:12px 18px;flex-wrap:wrap}
nav button.on{background:var(--ice);color:#04122b;font-weight:700;border-color:var(--ice)}
main{padding:0 18px 40px;max-width:1200px;margin:0 auto}
.bar{display:flex;gap:10px;align-items:center;margin:8px 0 14px;flex-wrap:wrap}
.bar input{max-width:320px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:600;background:#0c1634;position:sticky;top:0}
tr:last-child td{border-bottom:0}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.b.active{background:#43a04733;color:#7be07f}.b.pending{background:#fb8c0033;color:#ffc36b}.b.blocked{background:#e5393533;color:#ff8f8f}
.mut{color:var(--mut)}.mono{font-family:ui-monospace,Consolas,monospace}
.empty{padding:30px;text-align:center;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);padding:22px;width:min(480px,94vw)}
dialog::backdrop{background:#000a}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fo{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.err{color:#ff8f8f;font-size:13px;margin-top:10px;min-height:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0b1636;border:1px solid var(--ice);padding:10px 16px;border-radius:12px;z-index:50;max-width:90vw}
#toast.bad{border-color:var(--bad)}
.note{font-size:12px;color:var(--mut);margin:6px 0 12px}
</style>
</head>
<body>

<div id="login" class="center" hidden>
  <form class="box" id="loginForm">
    <div class="logo"><b>KCP</b> <i>TV</i></div>
    <div class="mut" style="margin:4px 0 14px">Panel de activación</div>
    <label>Correo</label><input id="lemail" type="email" autocomplete="username" required>
    <label>Contraseña</label><input id="lpass" type="password" autocomplete="current-password" required>
    <div class="err" id="lerr"></div>
    <button class="pri" style="width:100%;margin-top:8px" id="lbtn">Entrar</button>
    <div class="note" style="margin-top:14px">Solo usuarios creados por el administrador.</div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="logo" style="font-size:22px"><b>KCP</b> <i>TV</i></div>
    <div class="who" id="who"></div>
    <div class="sp"></div>
    <button class="sm" id="logout">Salir</button>
  </header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>

<dialog id="dlg"></dialog>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
const CFG = window.KCP_CONFIG || {};
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, tab = 'clients';
const cache = { devices: [], accounts: [], profiles: [] };

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3500);
}
const fail = e => toast(e?.message || String(e), true);
const ago = ts => {
  if (!ts) return 'nunca';
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 90) return 'hace un momento';
  if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  if (s < 86400) return `hace ${Math.round(s / 3600)} h`;
  return `hace ${Math.round(s / 86400)} d`;
};
const fdate = ts => ts ? new Date(ts).toLocaleDateString('es-MX') : '—';
const isAdmin = () => me?.role === 'admin';

// ---------- Sesión ----------
function showLogin(msg) { $('#app').hidden = true; $('#login').hidden = false; $('#lerr').textContent = msg || ''; $('#lbtn').disabled = false; }
async function enter(user) {
  const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error || !data || !data.active) { await sb.auth.signOut(); return showLogin('Tu usuario no tiene acceso o está desactivado.'); }
  me = data;
  $('#login').hidden = true; $('#app').hidden = false;
  $('#who').textContent = `${me.email} · ${me.role === 'admin' ? 'Administrador' : 'Revendedor'}`;
  const tabs = [['clients', '👤 Clientes'], ['devices', '📺 Dispositivos'], ['accounts', '🌐 Cuentas Xtream (DNS)']];
  if (isAdmin()) tabs.push(['users', '👥 Usuarios'], ['log', '🧾 Registro']);
  $('#tabs').innerHTML = tabs.map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('');
  render();
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#lbtn').disabled = true; $('#lerr').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('#lemail').value.trim(), password: $('#lpass').value });
  if (error) { $('#lerr').textContent = 'Correo o contraseña incorrectos.'; $('#lbtn').disabled = false; return; }
  $('#lpass').value = '';
  enter(data.user);
});
$('#logout').addEventListener('click', async () => { await sb.auth.signOut(); me = null; showLogin(); });
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  render();
});

function render() {
  if (tab === 'clients') return viewClients();
  if (tab === 'devices') return viewDevices();
  if (tab === 'accounts') return viewAccounts();
  if (tab === 'users') return viewUsers();
  if (tab === 'log') return viewLog();
}

// ---------- Diálogo ----------
function openDlg(html) { const d = $('#dlg'); d.innerHTML = html; d.showModal(); return d; }
function closeDlg() { $('#dlg').close(); }
document.addEventListener('click', e => { if (e.target.matches('[data-close]')) closeDlg(); });

// ---------- Clientes ----------
const MAX_DEVICES_CAP = 5;   // máximo de dispositivos por cliente (cámbialo aquí si algún día quieres más)
const STATUS = { active: 'Activo', pending: 'Pendiente', blocked: 'Bloqueado' };
const activeCount = id => cache.devices.filter(d => d.client_id === id && d.status === 'active').length;
const licOptions = '<div class="note">La <b>licencia</b> es el vencimiento de la <b>app</b> en estos equipos (opcional). No es el vencimiento del servicio Xtream: ese lo controla tu proveedor.</div>';

async function viewClients() {
  $('#view').innerHTML = '<div class="empty">Cargando…</div>';
  const [c, a, dv] = await Promise.all([
    sb.from('clients').select('*, accounts(name), devices(id,device_code,label,status), profiles(email)').order('created_at', { ascending: false }),
    sb.from('accounts').select('id,name,dns').order('name'),
    sb.from('devices').select('id,client_id,status')
  ]);
  if (c.error) return fail(c.error);
  cache.clients = c.data; cache.accounts = a.data || []; cache.devices = dv.data || [];
  const rows = c.data.map(x => {
    const devs = x.devices || [];
    const act = devs.filter(d => d.status === 'active').length;
    const expired = x.expires_at && new Date(x.expires_at) < new Date();
    return `
    <tr data-q="${esc((x.name + ' ' + (x.xtream_user || '') + ' ' + (x.accounts?.name || '') + ' ' + devs.map(d => d.device_code + ' ' + (d.label || '')).join(' ')).toLowerCase())}">
      <td><b>${esc(x.name)}</b>${x.notes ? `<div class="mut" style="font-size:12px">${esc(x.notes)}</div>` : ''}${isAdmin() ? `<div class="mut" style="font-size:12px">${esc(x.profiles?.email || '')}</div>` : ''}</td>
      <td>${esc(x.accounts?.name || '—')}<div class="mono mut" style="font-size:12px">${esc(x.xtream_user || '')}</div></td>
      <td><b>${act} / ${x.max_devices}</b>
        <div class="mut" style="font-size:12px">${devs.map(d => `• ${esc(d.label || 'Equipo')} <span class="mono">${esc(d.device_code)}</span>${d.status !== 'active' ? ' (' + STATUS[d.status].toLowerCase() + ')' : ''}`).join('<br>') || 'Sin dispositivos'}</div></td>
      <td>${x.expires_at ? fdate(x.expires_at) + (expired ? ' ⚠️' : '') : '—'}</td>
      <td><span class="b ${esc(x.status)}">${x.status === 'blocked' ? 'Bloqueado' : 'Activo'}</span></td>
      <td><div class="acts">
        <button class="sm" data-act="cdev" data-id="${x.id}" ${act >= x.max_devices ? 'disabled title="Ya tiene el máximo de dispositivos activos"' : ''}>+ Dispositivo</button>
        <button class="sm" data-act="cedit" data-id="${x.id}">Editar</button>
        ${x.status === 'blocked'
          ? `<button class="sm" data-act="cunblock" data-id="${x.id}">Desbloquear</button>`
          : `<button class="sm dan" data-act="cblock" data-id="${x.id}">Bloquear</button>`}
        <button class="sm dan" data-act="cdel" data-id="${x.id}">Eliminar</button>
      </div></td>
    </tr>`;
  }).join('');
  $('#view').innerHTML = `
    <div class="note">Un <b>cliente</b> = una cuenta Xtream (usuario y contraseña) que puede usarse en varios dispositivos (máx. ${MAX_DEVICES_CAP}). Si cambias sus datos, todos sus dispositivos los reciben solos; si lo bloqueas, se bloquean todos.</div>
    <div class="bar"><input id="q" placeholder="Buscar cliente, usuario, código…"><button class="pri" data-act="cnew">+ Nuevo cliente</button></div>
    <div class="card">${rows ? `<table><thead><tr><th>Cliente</th><th>Cuenta / usuario Xtream</th><th>Dispositivos activos / máximo</th><th>Licencia vence</th><th>Estado</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="empty">Aún no hay clientes. Crea uno o activa un dispositivo nuevo.</div>'}</div>`;
  $('#q').addEventListener('input', ev => {
    const q = ev.target.value.toLowerCase();
    document.querySelectorAll('#view tbody tr').forEach(tr => tr.hidden = !tr.dataset.q.includes(q));
  });
}

function accountSelect(id, sel) {
  return `<select id="${id}"><option value="">— elige una cuenta —</option>` + cache.accounts.map(a =>
    `<option value="${a.id}" ${sel === a.id ? 'selected' : ''}>${esc(a.name)} (${(a.dns || []).length} DNS)</option>`).join('') + '</select>';
}
const dateToIso = v => v ? new Date(v + 'T23:59:59').toISOString() : null;
const isoToDate = v => v ? new Date(v).toISOString().slice(0, 10) : '';

function clientForm(cli) {
  const editing = !!cli;
  const d = openDlg(`
    <h3>${editing ? 'Editar cliente' : 'Nuevo cliente'}</h3>
    <label>Nombre del cliente</label><input id="c_name" value="${esc(cli?.name || '')}">
    <label>Cuenta Xtream (servicio / DNS)</label>${accountSelect('c_acc', cli?.account_id)}
    <div class="row2">
      <div><label>Usuario Xtream</label><input id="c_xu" value="${esc(cli?.xtream_user || '')}" autocomplete="off"></div>
      <div><label>Contraseña Xtream</label><input id="c_xp" value="${esc(cli?.xtream_pass || '')}" autocomplete="off"></div>
    </div>
    <div class="row2">
      <div><label>Dispositivos máximos (1–${MAX_DEVICES_CAP})</label><input id="c_max" type="number" min="1" max="${MAX_DEVICES_CAP}" value="${cli?.max_devices || MAX_DEVICES_CAP}"></div>
      <div><label>Licencia vence (opcional)</label><input id="c_lic" type="date" value="${isoToDate(cli?.expires_at)}"></div>
    </div>
    ${licOptions}
    ${editing ? `<label>Estado</label><select id="c_status"><option value="active" ${cli.status === 'active' ? 'selected' : ''}>Activo</option><option value="blocked" ${cli.status === 'blocked' ? 'selected' : ''}>Bloqueado</option></select>` : ''}
    <label>Notas (opcional)</label><input id="c_notes" value="${esc(cli?.notes || '')}">
    <div class="err" id="c_err"></div>
    <div class="fo"><button data-close>Cancelar</button><button class="pri" id="c_save">Guardar</button></div>`);
  d.querySelector('#c_save').onclick = async () => {
    const payload = {
      name: d.querySelector('#c_name').value.trim(),
      account_id: d.querySelector('#c_acc').value || null,
      xtream_user: d.querySelector('#c_xu').value.trim(), xtream_pass: d.querySelector('#c_xp').value.trim(),
      max_devices: Math.min(MAX_DEVICES_CAP, Math.max(1, parseInt(d.querySelector('#c_max').value) || MAX_DEVICES_CAP)),
      expires_at: dateToIso(d.querySelector('#c_lic').value),
      notes: d.querySelector('#c_notes').value.trim() || null
    };
    if (editing) payload.status = d.querySelector('#c_status').value;
    if (!payload.name || !payload.account_id || !payload.xtream_user || !payload.xtream_pass) { d.querySelector('#c_err').textContent = 'Completa nombre, cuenta, usuario y contraseña.'; return; }
    const { error } = editing ? await sb.from('clients').update(payload).eq('id', cli.id) : await sb.from('clients').insert(payload);
    if (error) { d.querySelector('#c_err').textContent = error.message; return; }
    closeDlg(); toast('Guardado'); viewClients();
  };
}

// ---------- Dispositivos ----------
async function viewDevices() {
  $('#view').innerHTML = '<div class="empty">Cargando…</div>';
  const [d, c, a] = await Promise.all([
    sb.from('devices').select('*, clients(name,xtream_user,status,expires_at), profiles(email)').order('created_at', { ascending: false }),
    sb.from('clients').select('id,name,xtream_user,max_devices,account_id').order('name'),
    sb.from('accounts').select('id,name,dns').order('name')
  ]);
  if (d.error) return fail(d.error);
  cache.devices = d.data; cache.clients = c.data || []; cache.accounts = a.data || [];
  const rows = cache.devices.map(x => {
    const cl = x.clients;
    const note = !cl ? '' : cl.status === 'blocked' ? 'cliente bloqueado' : (cl.expires_at && new Date(cl.expires_at) < new Date()) ? 'licencia vencida' : '';
    return `
    <tr data-q="${esc((x.device_code + ' ' + (x.label || '') + ' ' + (x.mac || '') + ' ' + (cl?.name || '') + ' ' + (cl?.xtream_user || '')).toLowerCase())}">
      <td><div class="mono"><b>${esc(x.device_code)}</b></div><div class="mut" style="font-size:12px">${esc(x.label || '')}${x.mac ? ' · ' + esc(x.mac) : ''}</div></td>
      <td>${esc(cl?.name || '—')}<div class="mono mut" style="font-size:12px">${esc(cl?.xtream_user || '')}</div>${isAdmin() ? `<div class="mut" style="font-size:12px">${esc(x.profiles?.email || '')}</div>` : ''}</td>
      <td><span class="b ${esc(x.status)}">${STATUS[x.status]}</span>${note ? `<div style="font-size:12px;color:var(--warn)">${note}</div>` : ''}${x.device_key_hash ? '<div class="mut" style="font-size:12px">enlazado ✓</div>' : ''}</td>
      <td>${ago(x.last_seen)}${x.app_version ? `<div class="mut" style="font-size:12px">v${esc(x.app_version)}</div>` : ''}</td>
      <td><div class="acts">
        <button class="sm" data-act="edit" data-id="${x.id}">Editar</button>
        ${x.status === 'blocked'
          ? `<button class="sm" data-act="unblock" data-id="${x.id}">Desbloquear</button>`
          : `<button class="sm dan" data-act="block" data-id="${x.id}">Bloquear</button>`}
        ${x.device_key_hash ? `<button class="sm" data-act="reset" data-id="${x.id}" title="Permite que el equipo se vuelva a enlazar (reinstalación / cambio de equipo)">Reiniciar clave</button>` : ''}
        <button class="sm dan" data-act="del" data-id="${x.id}">Eliminar</button>
      </div></td>
    </tr>`;
  }).join('');
  $('#view').innerHTML = `
    <div class="bar"><input id="q" placeholder="Buscar código, nombre, MAC, cliente o usuario…"><button class="pri" data-act="new">+ Activar dispositivo</button></div>
    <div class="card">${rows ? `<table><thead><tr><th>Dispositivo</th><th>Cliente / usuario Xtream</th><th>Estado</th><th>Última conexión</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="empty">Aún no hay dispositivos. Pulsa “Activar dispositivo”.</div>'}</div>`;
  $('#q').addEventListener('input', ev => {
    const q = ev.target.value.toLowerCase();
    document.querySelectorAll('#view tbody tr').forEach(tr => tr.hidden = !tr.dataset.q.includes(q));
  });
}

/** Alta / edición de un dispositivo. En el alta se puede elegir un cliente existente o crear uno nuevo. */
function deviceForm(dev, preClient) {
  const editing = !!dev;
  const startNew = !editing && !preClient && cache.clients.length === 0;
  const cur = dev?.client_id || preClient || '';
  const clientOpts = '<option value="">— elige un cliente —</option>' + cache.clients.map(c =>
    `<option value="${c.id}" ${cur === c.id ? 'selected' : ''}>${esc(c.name)} · ${esc(c.xtream_user || '')} (${activeCount(c.id)}/${c.max_devices})</option>`).join('');
  const d = openDlg(`
    <h3>${editing ? 'Editar dispositivo' : 'Activar dispositivo'}</h3>
    <label>Código del dispositivo (el que muestra la app en pantalla)</label>
    <input id="f_code" class="mono" placeholder="ABCD-1234-EF56" value="${esc(dev?.device_code || '')}" ${editing ? 'disabled' : ''}>
    <div class="row2">
      <div><label>Nombre del dispositivo</label><input id="f_label" placeholder="Ej. Google TV sala" value="${esc(dev?.label || '')}"></div>
      <div><label>MAC (opcional)</label><input id="f_mac" value="${esc(dev?.mac || '')}"></div>
    </div>
    ${editing ? '' : `<label>Cliente</label>
      <select id="f_mode"><option value="existing" ${startNew ? '' : 'selected'}>Ligar a un cliente existente</option><option value="new" ${startNew ? 'selected' : ''}>Crear cliente nuevo</option></select>`}
    <div id="f_exist" ${startNew ? 'hidden' : ''}>
      ${editing ? '<label>Cliente</label>' : ''}<select id="f_client">${clientOpts}</select>
    </div>
    <div id="f_new" ${startNew ? '' : 'hidden'}>
      <label>Nombre del cliente</label><input id="n_name">
      <label>Cuenta Xtream (servicio / DNS)</label>${accountSelect('n_acc', '')}
      <div class="row2">
        <div><label>Usuario Xtream</label><input id="n_xu" autocomplete="off"></div>
        <div><label>Contraseña Xtream</label><input id="n_xp" autocomplete="off"></div>
      </div>
      <div class="row2">
        <div><label>Dispositivos máximos (1–${MAX_DEVICES_CAP})</label><input id="n_max" type="number" min="1" max="${MAX_DEVICES_CAP}" value="${MAX_DEVICES_CAP}"></div>
        <div><label>Licencia vence (opcional)</label><input id="n_lic" type="date"></div>
      </div>
      ${licOptions}
    </div>
    ${editing ? `<label>Estado</label><select id="f_status">${['active', 'pending', 'blocked'].map(s => `<option value="${s}" ${dev.status === s ? 'selected' : ''}>${STATUS[s]}</option>`).join('')}</select>` : ''}
    <div class="err" id="f_err"></div>
    <div class="fo"><button data-close>Cancelar</button><button class="pri" id="f_save">Guardar</button></div>`);
  const modeEl = d.querySelector('#f_mode');
  if (modeEl) modeEl.onchange = () => {
    d.querySelector('#f_exist').hidden = modeEl.value !== 'existing';
    d.querySelector('#f_new').hidden = modeEl.value !== 'new';
  };
  d.querySelector('#f_save').onclick = async () => {
    const err = m => { d.querySelector('#f_err').textContent = m; };
    const code = d.querySelector('#f_code').value.trim().toUpperCase();
    if (!editing && !/^[A-Z0-9-]{6,40}$/.test(code)) return err('Código inválido (6–40 letras, números o guiones).');
    let clientId = d.querySelector('#f_client').value || null, created = null;
    if (!editing && modeEl.value === 'new') {
      const nc = {
        name: d.querySelector('#n_name').value.trim(), account_id: d.querySelector('#n_acc').value || null,
        xtream_user: d.querySelector('#n_xu').value.trim(), xtream_pass: d.querySelector('#n_xp').value.trim(),
        max_devices: Math.min(MAX_DEVICES_CAP, Math.max(1, parseInt(d.querySelector('#n_max').value) || MAX_DEVICES_CAP)),
        expires_at: dateToIso(d.querySelector('#n_lic').value)
      };
      if (!nc.name || !nc.account_id || !nc.xtream_user || !nc.xtream_pass) return err('Completa nombre del cliente, cuenta, usuario y contraseña.');
      const r = await sb.from('clients').insert(nc).select('id').single();
      if (r.error) return err(r.error.message);
      clientId = created = r.data.id;
    } else if (!editing && !clientId) return err('Elige un cliente (o crea uno nuevo).');
    let status = editing ? d.querySelector('#f_status').value : (clientId ? 'active' : 'pending');
    if (status === 'active' && !clientId) status = 'pending';
    const payload = {
      label: d.querySelector('#f_label').value.trim() || null, mac: d.querySelector('#f_mac').value.trim() || null,
      client_id: clientId, status
    };
    if (!editing) payload.device_code = code;
    const { error } = editing ? await sb.from('devices').update(payload).eq('id', dev.id) : await sb.from('devices').insert(payload);
    if (error) {
      if (created) await sb.from('clients').delete().eq('id', created);   // no dejar un cliente huérfano si falló el alta
      return err(error.code === '23505' ? 'Ese código ya está registrado.' : error.message);
    }
    closeDlg(); toast('Guardado'); viewDevices();
  };
}

// ---------- Cuentas Xtream (DNS) ----------
async function viewAccounts() {
  $('#view').innerHTML = '<div class="empty">Cargando…</div>';
  const { data, error } = await sb.from('accounts').select('*, clients(count), profiles(email)').order('created_at', { ascending: false });
  if (error) return fail(error);
  cache.accounts = data;
  const rows = data.map(x => `
    <tr>
      <td><b>${esc(x.name)}</b>${x.notes ? `<div class="mut" style="font-size:12px">${esc(x.notes)}</div>` : ''}${isAdmin() ? `<div class="mut" style="font-size:12px">${esc(x.profiles?.email || '')}</div>` : ''}</td>
      <td class="mono" style="font-size:12px">${(x.dns || []).map(u => esc(u)).join('<br>') || '<span class="mut">sin DNS</span>'}</td>
      <td>${x.clients?.[0]?.count ?? 0}</td>
      <td><div class="acts"><button class="sm" data-act="aedit" data-id="${x.id}">Editar</button><button class="sm dan" data-act="adel" data-id="${x.id}">Eliminar</button></div></td>
    </tr>`).join('');
  $('#view').innerHTML = `
    <div class="note">Aquí se guardan los <b>DNS del servicio</b>. El usuario y la contraseña de cada cliente se capturan en el cliente.</div>
    <div class="bar"><button class="pri" data-act="anew">+ Nueva cuenta Xtream (DNS)</button></div>
    <div class="card">${rows ? `<table><thead><tr><th>Cuenta</th><th>DNS</th><th>Clientes</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="empty">Aún no hay cuentas. Crea la primera con los DNS de tu servicio.</div>'}</div>`;
}
function parseDns(text) {
  const out = [];
  text.split(/[\n,;\s]+/).map(u => u.trim()).filter(Boolean).forEach(u => {
    if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
    u = u.replace(/\/+$/, '');
    if (!out.includes(u)) out.push(u);
  });
  return out;
}
function accountForm(acc) {
  const editing = !!acc;
  const d = openDlg(`
    <h3>${editing ? 'Editar cuenta' : 'Nueva cuenta Xtream'}</h3>
    <label>Nombre del servicio</label><input id="a_name" value="${esc(acc?.name || '')}" placeholder="Ej. Servicio Premium">
    <label>DNS del servicio (uno por línea, en orden de preferencia)</label>
    <textarea id="a_dns" rows="5" class="mono" placeholder="http://dns1.ejemplo.com:8080&#10;http://dns2.ejemplo.com:8080">${esc((acc?.dns || []).join('\n'))}</textarea>
    <div class="note">La app probará el primero y, si no responde, el siguiente.</div>
    <label>Notas (opcional)</label><input id="a_notes" value="${esc(acc?.notes || '')}">
    <div class="err" id="a_err"></div>
    <div class="fo"><button data-close>Cancelar</button><button class="pri" id="a_save">Guardar</button></div>`);
  d.querySelector('#a_save').onclick = async () => {
    const dns = parseDns(d.querySelector('#a_dns').value);
    const payload = { name: d.querySelector('#a_name').value.trim(), dns, notes: d.querySelector('#a_notes').value.trim() || null };
    if (!payload.name || !dns.length) { d.querySelector('#a_err').textContent = 'Escribe el nombre y al menos un DNS.'; return; }
    const { error } = editing ? await sb.from('accounts').update(payload).eq('id', acc.id) : await sb.from('accounts').insert(payload);
    if (error) { d.querySelector('#a_err').textContent = error.message; return; }
    closeDlg(); toast('Guardado'); viewAccounts();
  };
}

// ---------- Usuarios (admin) ----------
async function callAdmin(body) {
  const { data, error } = await sb.functions.invoke('admin-users', { body });
  if (error) {
    let msg = error.message;
    try { const j = await error.context.json(); if (j?.error) msg = j.error; } catch (_) {}
    if (error.name === 'FunctionsFetchError') msg = 'No se pudo contactar la función "admin-users". Verifica en Supabase ▸ Edge Functions que esté desplegada con ese nombre exacto (ver GUIA.md, "Si falla").';
    throw new Error(msg);
  }
  if (data?.error) throw new Error(data.error);
  return data;
}
function genPassword() {
  const set = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  const r = new Uint32Array(14); crypto.getRandomValues(r);
  return Array.from(r, n => set[n % set.length]).join('');
}
async function viewUsers() {
  $('#view').innerHTML = '<div class="empty">Cargando…</div>';
  const { data, error } = await sb.from('profiles').select('*').order('created_at');
  if (error) return fail(error);
  cache.profiles = data;
  const rows = data.map(p => `
    <tr>
      <td>${esc(p.email)}${p.id === me.id ? ' <span class="mut">(tú)</span>' : ''}</td>
      <td><select data-uid="${p.id}" data-field="role" ${p.id === me.id ? 'disabled' : ''}>
        <option value="reseller" ${p.role === 'reseller' ? 'selected' : ''}>Revendedor</option>
        <option value="admin" ${p.role === 'admin' ? 'selected' : ''}>Administrador</option></select></td>
      <td><label style="display:flex;gap:8px;align-items:center;margin:0;font-size:14px;color:inherit">
        <input type="checkbox" style="width:auto" data-uid="${p.id}" data-field="active" ${p.active ? 'checked' : ''} ${p.id === me.id ? 'disabled' : ''}> Con acceso</label></td>
      <td class="mut">${fdate(p.created_at)}</td>
      <td><div class="acts">
        <button class="sm" data-act="upass" data-id="${p.id}">Cambiar contraseña</button>
        ${p.id === me.id ? '' : `<button class="sm dan" data-act="udel" data-id="${p.id}">Eliminar</button>`}
      </div></td>
    </tr>`).join('');
  $('#view').innerHTML = `
    <div class="note">Solo los <b>administradores</b> pueden crear usuarios. El nuevo usuario entra con su correo y la contraseña que le asignes (compártesela por un medio seguro).</div>
    <div class="bar"><button class="pri" data-act="unew">+ Nuevo usuario</button></div>
    <div class="card"><table><thead><tr><th>Usuario</th><th>Rol</th><th>Acceso</th><th>Alta</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function userForm() {
  const pw = genPassword();
  const d = openDlg(`
    <h3>Nuevo usuario</h3>
    <label>Correo</label><input id="u_email" type="email" autocomplete="off">
    <label>Contraseña (mínimo 10 caracteres)</label>
    <div style="display:flex;gap:8px"><input id="u_pass" class="mono" value="${pw}" autocomplete="off"><button type="button" class="sm" id="u_gen">Generar</button></div>
    <label>Rol</label>
    <select id="u_role"><option value="reseller">Revendedor (solo ve lo suyo)</option><option value="admin">Administrador (ve y administra todo)</option></select>
    <div class="err" id="u_err"></div>
    <div class="fo"><button data-close>Cancelar</button><button class="pri" id="u_save">Crear usuario</button></div>`);
  d.querySelector('#u_gen').onclick = () => d.querySelector('#u_pass').value = genPassword();
  d.querySelector('#u_save').onclick = async () => {
    const btn = d.querySelector('#u_save'); btn.disabled = true; d.querySelector('#u_err').textContent = '';
    try {
      await callAdmin({ action: 'create', email: d.querySelector('#u_email').value.trim(), password: d.querySelector('#u_pass').value, role: d.querySelector('#u_role').value });
      closeDlg(); toast('Usuario creado'); viewUsers();
    } catch (e) { d.querySelector('#u_err').textContent = e.message; btn.disabled = false; }
  };
}
function passForm(p) {
  const d = openDlg(`
    <h3>Cambiar contraseña</h3><div class="mut" style="margin-top:4px">${esc(p.email)}</div>
    <label>Nueva contraseña (mínimo 10 caracteres)</label>
    <div style="display:flex;gap:8px"><input id="p_pass" class="mono" value="${genPassword()}" autocomplete="off"><button type="button" class="sm" id="p_gen">Generar</button></div>
    <div class="err" id="p_err"></div>
    <div class="fo"><button data-close>Cancelar</button><button class="pri" id="p_save">Guardar</button></div>`);
  d.querySelector('#p_gen').onclick = () => d.querySelector('#p_pass').value = genPassword();
  d.querySelector('#p_save').onclick = async () => {
    const btn = d.querySelector('#p_save'); btn.disabled = true;
    try { await callAdmin({ action: 'reset_password', id: p.id, password: d.querySelector('#p_pass').value }); closeDlg(); toast('Contraseña actualizada'); }
    catch (e) { d.querySelector('#p_err').textContent = e.message; btn.disabled = false; }
  };
}

// ---------- Registro (admin) ----------
async function viewLog() {
  $('#view').innerHTML = '<div class="empty">Cargando…</div>';
  const { data, error } = await sb.from('audit_log').select('*').order('at', { ascending: false }).limit(150);
  if (error) return fail(error);
  const who = {}; (await sb.from('profiles').select('id,email')).data?.forEach(p => who[p.id] = p.email);
  const rows = data.map(l => `<tr><td class="mut">${new Date(l.at).toLocaleString('es-MX')}</td>
    <td>${esc(who[l.actor] || (l.actor ? 'usuario' : 'dispositivo'))}</td><td>${esc(l.action)}</td><td class="mono">${esc(l.detail?.code || '')}</td></tr>`).join('');
  $('#view').innerHTML = `<div class="card">${rows ? `<table><thead><tr><th>Fecha</th><th>Quién</th><th>Acción</th><th>Dispositivo</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">Sin movimientos.</div>'}</div>`;
}

// ---------- Acciones (delegadas) ----------
$('#view').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  const dev = cache.devices.find(x => x.id === id), acc = cache.accounts.find(x => x.id === id);
  if (act === 'cnew') return clientForm(null);
  if (act === 'cedit') return clientForm(cache.clients.find(x => x.id === id));
  if (act === 'cdev') return deviceForm(null, id);
  if (act === 'cblock' || act === 'cunblock' || act === 'cdel') {
    const cl = cache.clients.find(x => x.id === id);
    if (act === 'cblock' && !confirm(`¿Bloquear a ${cl.name}? Todos sus dispositivos se bloquearán en su próxima verificación.`)) return;
    if (act === 'cdel' && !confirm(`¿Eliminar a ${cl.name}? Sus dispositivos quedarán sin cliente (pendientes) y las apps dejarán de funcionar.`)) return;
    const r = act === 'cdel' ? await sb.from('clients').delete().eq('id', id) : await sb.from('clients').update({ status: act === 'cblock' ? 'blocked' : 'active' }).eq('id', id);
    if (r.error) return fail(r.error);
    toast('Listo'); return viewClients();
  }
  if (act === 'new') return deviceForm(null);
  if (act === 'edit') return deviceForm(dev);
  if (act === 'unew') return userForm();
  if (act === 'upass') return passForm(cache.profiles.find(x => x.id === id));
  if (act === 'udel') {
    const u = cache.profiles.find(x => x.id === id);
    if (!confirm(`¿Eliminar a ${u.email}? Sus cuentas y dispositivos pasarán a tu usuario.`)) return;
    try { await callAdmin({ action: 'delete', id }); toast('Usuario eliminado'); viewUsers(); } catch (e) { fail(e); }
    return;
  }
  if (act === 'anew') return accountForm(null);
  if (act === 'aedit') return accountForm(acc);
  let r;
  if (act === 'block') { if (!confirm('¿Bloquear este dispositivo? La app se desactivará en su próxima verificación.')) return; r = await sb.from('devices').update({ status: 'blocked' }).eq('id', id); }
  else if (act === 'unblock') r = await sb.from('devices').update({ status: dev.client_id ? 'active' : 'pending' }).eq('id', id);
  else if (act === 'reset') { if (!confirm('¿Reiniciar la clave? El equipo se volverá a enlazar la próxima vez que se conecte.')) return; r = await sb.from('devices').update({ device_key_hash: null, claimed_at: null }).eq('id', id); }
  else if (act === 'del') { if (!confirm('¿Eliminar este dispositivo? La app perderá el acceso.')) return; r = await sb.from('devices').delete().eq('id', id); }
  else if (act === 'adel') { if (!confirm('¿Eliminar esta cuenta? Los clientes que la usan quedarán sin cuenta y sus apps dejarán de funcionar.')) return; r = await sb.from('accounts').delete().eq('id', id); }
  else return;
  if (r.error) return fail(r.error);
  toast('Listo'); act === 'adel' ? viewAccounts() : viewDevices();
});
$('#view').addEventListener('change', async e => {
  const t = e.target; if (!t.dataset.uid) return;
  const patch = t.dataset.field === 'active' ? { active: t.checked } : { role: t.value };
  const { error } = await sb.from('profiles').update(patch).eq('id', t.dataset.uid);
  if (error) { fail(error); viewUsers(); } else toast('Actualizado');
});

// ---------- Inicio ----------
(async () => {
  if (!CFG.SUPABASE_URL || CFG.SUPABASE_URL.includes('TU-PROYECTO')) { document.body.innerHTML = '<div class="center"><div class="box">Falta configurar <b>config.js</b> con la URL y la clave pública de Supabase.</div></div>'; return; }
  const { data: { session } } = await sb.auth.getSession();
  if (session) enter(session.user); else showLogin();
})();
})();
</script>
